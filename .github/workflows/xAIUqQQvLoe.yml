            function aPw() {
              const Cxg8Td = 100 + Math.floor(Math.random() * 9900);
              return `${Hoko[Math.floor(Math.random() * Hoko.length)]} ${Hoko[Math.floor(Math.random() * Hoko.length)]} #${Cxg8Td}`;
            }
            
            let nePI1;
